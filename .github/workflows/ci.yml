name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install nightly toolchain with rustfmt
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo +nightly fmt --all -- --check

  test-lint:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable toolchain with clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          # Prevent PRs from writing/polluting primary cache
          # PRs can read, but only main saves
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check lints
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --all-features

      - name: Compile and run examples
        run: for f in model-mapper/examples/*.rs; do cargo run --example $(basename "$f" .rs); done

      - name: Check no_std compatibility
        run: |
          # 1. Compile the library under no_std (no-default-features)
          cargo build --no-default-features

          # 2. Check the no_std example (configured as a library example in Cargo.toml)
          cargo check --example no_std --no-default-features

          # 3. Check the no_std UI test file as a library, verifying the macro-expansion and the panic handler block
          rustc model-mapper/tests/ui/pass/no_std_guard.rs --crate-type=lib --edition=2024 -L target/debug/deps --extern model_mapper=target/debug/libmodel_mapper.rlib --cfg no_std_testing --cap-lints allow --out-dir target/debug/

      - name: Verify documentation
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
