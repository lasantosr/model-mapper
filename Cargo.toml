[workspace]
members = ["model-mapper", "model-mapper-macros"]
resolver = "2"

[workspace.package]
version = "0.8.0"
edition = "2024"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/lasantosr/model-mapper"
keywords = ["model", "mapper", "derive", "from", "into"]
categories = ["development-tools", "rust-patterns", "no-std"]

[workspace.dependencies]
model-mapper-macros = { version = "=0.8.0", path = "./model-mapper-macros" }

anyhow            = "1"
chrono            = "0.4"
darling           = "0.23"
heck              = "0.5"
insta             = "1.39"
macro-field-utils = "0.5"
prettyplease      = "0.2"
proc-macro-crate  = "3"
proc-macro2       = "1"
quote             = "1"
serde             = "1"
serde_json        = "1"
syn               = "2"
thiserror         = "2"
trybuild          = "1.0"

# Lints: https://doc.rust-lang.org/rustc/lints/listing/allowed-by-default.html
[workspace.lints.rust]
# Standard safety/correctness
non_ascii_idents  = "deny"
unsafe_code       = "deny"
unstable_features = "deny"

# High-quality defaults
ambiguous_negative_literals   = "warn"
closure_returning_async_block = "warn"
redundant_lifetimes           = "warn"
unit_bindings                 = "warn"
unreachable_pub               = "warn"
unused_lifetimes              = "warn"
unused_qualifications         = "warn"

# Categories: https://doc.rust-lang.org/clippy/
# Lints: https://rust-lang.github.io/rust-clippy/master/
[workspace.lints.clippy]
cargo    = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Add strict denials for specific dangerous practices
dbg_macro   = "deny"
expect_used = "deny"
unwrap_used = "deny"

# Explicitly allow noisy or stylistic lints
assigning_clones           = "allow"
cargo_common_metadata      = "allow"
inline_always              = "allow"
items_after_statements     = "allow"
map_unwrap_or              = "allow"
missing_errors_doc         = "allow"
missing_panics_doc         = "allow"
needless_pass_by_value     = "allow"
similar_names              = "allow"
struct_excessive_bools     = "allow"
unchecked_time_subtraction = "allow"
unused_self                = "allow"
wildcard_imports           = "allow"

# Warn on some restrictions
absolute_paths                       = "warn"
alloc_instead_of_core                = "warn"
allow_attributes                     = "warn"
allow_attributes_without_reason      = "warn"
arithmetic_side_effects              = "warn"
as_conversions                       = "warn"
as_pointer_underscore                = "warn"
as_underscore                        = "warn"
assertions_on_result_states          = "warn"
cfg_not_test                         = "warn"
clone_on_ref_ptr                     = "warn"
create_dir                           = "warn"
decimal_literal_representation       = "warn"
default_union_representation         = "warn"
doc_paragraphs_missing_punctuation   = "warn"
else_if_without_else                 = "warn"
empty_drop                           = "warn"
empty_enum_variants_with_brackets    = "warn"
empty_structs_with_brackets          = "warn"
exit                                 = "warn"
filetype_is_file                     = "warn"
float_cmp_const                      = "warn"
if_then_some_else_none               = "warn"
indexing_slicing                     = "warn"
infinite_loop                        = "warn"
integer_division                     = "warn"
let_underscore_must_use              = "warn"
let_underscore_untyped               = "warn"
lossy_float_literal                  = "warn"
map_with_unused_argument_over_ranges = "warn"
mem_forget                           = "warn"
min_ident_chars                      = "warn"
missing_assert_message               = "warn"
mixed_read_write_in_expression       = "warn"
panic                                = "warn"
precedence_bits                      = "warn"
print_stderr                         = "warn"
print_stdout                         = "warn"
rc_buffer                            = "warn"
rc_mutex                             = "warn"
redundant_test_prefix                = "warn"
redundant_type_annotations           = "warn"
ref_patterns                         = "warn"
rest_pat_in_fully_bound_structs      = "warn"
return_and_then                      = "warn"
self_named_module_files              = "warn"
semicolon_inside_block               = "warn"
shadow_unrelated                     = "warn"
std_instead_of_alloc                 = "warn"
std_instead_of_core                  = "warn"
str_to_string                        = "warn"
string_add                           = "warn"
string_lit_chars_any                 = "warn"
suspicious_xor_used_as_pow           = "warn"
tests_outside_test_module            = "warn"
todo                                 = "warn"
try_err                              = "warn"
undocumented_unsafe_blocks           = "warn"
unimplemented                        = "warn"
unnecessary_self_imports             = "warn"
unreachable                          = "warn"
unseparated_literal_suffix           = "warn"
unused_result_ok                     = "warn"
unused_trait_names                   = "warn"
# 1.99.0
# rest_pattern_accessible_field        = "warn"
# unnecessary_rest_pattern             = "warn"
